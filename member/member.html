<!-- member.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>으차방 MyPage</title>
    <link rel="stylesheet" href="member.css">
    <link rel="stylesheet" href="attend.css">
    <link rel="stylesheet" href="attendCard.css">
    <link rel="stylesheet" href="pwChange.css">
</head>
<body>
    <div class="layout">
        <header id="topArea">
            <span class="hello">어서오세요!</span>
            <div class="topLinks">
                <span id="adminLoginBtn" 
                    class="textLink hidden">
                    운영자로그인
                </span>
                <span id="changePasswordBtn" 
                    class="textLink">
                    비밀번호 변경
                </span>
            </div>
        </header>

        <nav id="upperArea">
            <div class="upperInfo">
                <div class="nameRow">
                    <h1 id="memberNickname">회원님</h1>
                    <div id="boardPosition" 
                        class="boardPosition">
                        (벙 게임 현 위치 0)
                    </div>
                </div>

                <div class="point">
                    <span id="pointLabel">9월 출석</span>
                    <span id="totalPoint">0회</span>
                </div>
            </div>

            <div class="contentTabs">
                <button type="button" 
                    class="contentTab active" 
                    data-tab="attendance">
                    출석체크
                </button>
                <button type="button" 
                    class="contentTab" 
                    data-tab="point">
                    포인트내역
                </button>
            </div>
        </nav>

        <main id="contentArea">
            <div class="container">
                <div id="attendanceContent" class="tabContent">
                    <div class="attendanceHeader">
                        <div class="attendanceTitle">
                            오늘의 한마디</div>
                        <div id="attendanceDate" 
                            class="attendanceDate">
                        </div>
                    </div>

                    <div class="attendanceWrite">
                        <textarea
                            id="attendanceInput"
                            maxlength="100"
                            rows="1"
                            placeholder="오늘의 출석 한마디를 남겨주세요."></textarea>
                        <button type="button" 
                            id="attendanceBtn">
                            등록
                        </button>
                    </div>

                    <div id="attendanceList" 
                        class="attendanceList">
                    </div>
                </div>

                <div id="pointContent" class="tabContent hidden">
                    <div class="historyTitle">
                        포인트 상세내역
                    </div>
                    <hr>
                    <div id="historyList"></div>
                </div>
            </div>
        </main>

        <footer id="footerArea">
            <div class="left">
                <div>카카오톡 오픈채팅</div>
                <a href="https://open.kakao.com/o/g7b2DGti"
                    target="_blank"
                    rel="noopener noreferrer">
                    8090 으차방
                </a>
            </div>

            <div class="right">
                <div id="version"></div>
                <div id="admin"></div>
            </div>
        </footer>
    </div>

    <div id="attendanceRewardModal" class="modal hidden">
        <div class="modalBox attendanceRewardBox">
            <h2>출석체크보상</h2>
            <p id="attendanceRewardPoint"></p>
            <div class="modalButton">
                <button id="attendanceRewardOk">
                    확인
                </button>
            </div>
        </div>
    </div>

    <div id="pwModal" class="modal hidden">
        <div class="modalBox">
            <h2>비밀번호 변경</h2>
            <input type="password" 
                id="currentPw" 
                placeholder="현재 비밀번호">
            <input type="password" 
                id="newPw" 
                placeholder="새 비밀번호">
            <input type="password" 
                id="newPwCheck" 
                placeholder="새 비밀번호 확인">

            <div id="pwError" class="pwError"></div>

            <div class="modalButton">
                <button id="pwOk">확인</button>
                <button id="pwCancel">취소</button>
            </div>
        </div>
    </div>

    <div id="completeModal" class="modal hidden">
        <div class="modalBox completeModalBox">
            <p>비밀번호가 변경되었습니다.</p>
        </div>
    </div>

    <div id="adminModal" class="adminModal hidden">
        <div class="adminBox">
            <div class="adminHeader">
                <h2>운영자 로그인</h2>
                <button
                    id="adminCancelBtn"
                    class="closeBtn"
                    type="button"
                    aria-label="닫기">
                </button>
            </div>

            <input
                type="password"
                id="adminPassword"
                placeholder="비밀번호를 입력하세요.">

            <p id="adminMessage"></p>

            <div class="adminButton">
                <button id="adminOkBtn">확인</button>
            </div>
        </div>
    </div>

    <script type="module" src="member.js"></script>
    <script type="module" src="attend.js"></script>
    <script type="module" src="pwChange.js"></script>
    <script type="module" src="../admin/adminLogin.js"></script>
</body>
</html>
