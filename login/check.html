<!-- check.html -->
<!DOCTYPE html>
<html lang="ko" style="visibility:hidden;">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">
    <title>으차방 MyPage</title>
    <script type="module">
        import {specialDayPeriod} from "../utils.js";

        const style = document.createElement("link");
        style.id = "pageStyle";
        style.rel = "stylesheet";
        style.href = specialDayPeriod()
            ? "check크리스마스.css"
            : "check.css";

        style.onload = () => {
            document.documentElement.style.visibility = "visible";
        };

        document.head.appendChild(style);
    </script>
</head>
<body>
    <div class="layout">
        <header id="topArea"></header>
        <nav id="upperArea"></nav>

        <main id="contentArea">
            <div class="checkContainer">
                <div class="checkStatus">
                    <div class="checkLoader"></div>
                    <span class="checkText">
                        자동 로그인
                    </span>
                </div>
            </div>
        </main>

        <footer id="footerArea">
            <div class="left">
                <div>카카오톡 오픈채팅</div>
                <a
                    href="https://open.kakao.com/o/g7b2DGti"
                    target="_blank"
                    rel="noopener noreferrer">
                    8090 으차방
                </a>
            </div>

            <div class="right">
                <div id="version"></div>
                <div id="admin"></div>
            </div>
        </footer>
    </div>

    <script
        type="module"
        src="check.js">
    </script>
</body>
</html>
