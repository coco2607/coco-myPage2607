<!-- admin.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자</title>
    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet" href="../mstate/mstate.css">
    <link rel="stylesheet" href="../point/adpoint.css">
</head>
<body>
    <div class="layout">
        <header id="topArea">
            <div class="adminTitle">
                <span class="hello">안녕하세요!</span>
                <span class="title">관리자님</span>
            </div>

            <a href="#" id="excelBtn" class="excelLink">
                Excel UP/DOWN
            </a>
        </header>

        <nav id="upperArea">
            <div class="upperInfo">
                <div class="pointHeader">
                    <button id="plusBtn" class="pointBtn">
                        포인트 적립
                    </button>

                    <button id="minusBtn" class="pointBtn">
                        포인트 사용
                    </button>
                </div>
            </div>

            <div class="memberTop">
                <h3 class="sectionTitle">
                    회원관리
                    <span id="memberCount" class="memberCount">(0명)</span>
                </h3>
            </div>

            <hr class="line">
        </nav>

        <main id="contentArea">
            <div id="memberList">
                <!-- JS 생성 -->
            </div>
        </main>

        <footer id="footerArea">
            <div class="left">
                <div>카카오톡 오픈채팅</div>
                <a
                    href="https://open.kakao.com/o/g7b2DGti"
                    target="_blank"
                    rel="noopener noreferrer">
                    8090 으차방
                </a>
            </div>

            <div class="right">
                <div id="version"></div>
                <div id="admin"></div>
            </div>
        </footer>
    </div>

    <!-- Excel UP/DOWN -->
    <div id="excelModal" class="modal hidden">
        <div class="modalBox">
            <div class="excelButton">
                <button id="excelUploadBtn">
                    Excel Upload
                </button>

                <button id="excelDownloadBtn">
                    Excel Download
                </button>
            </div>
        </div>
    </div>

    <!-- 포인트 입력 -->
    <div id="pointModal" class="modal hidden">
        <div class="modalBox pointBox">
            <h3 id="pointTitle">
                포인트 적립
            </h3>

            <div class="pointScroll">
                <div id="pointRows"></div>
            </div>

            <div class="pointBtnBox">
                <button id="pointApplyBtn">
                    적용
                </button>

                <button id="pointCancelBtn">
                    취소
                </button>
            </div>
        </div>
    </div>

    <!-- 포인트 확인 -->
    <div id="pointConfirmModal" class="modal hidden">
        <div class="modalBox">
            <p class="modalText">
                포인트를 적용하시겠습니까?
            </p>

            <div id="pointConfirmList" class="pointConfirmList">
                <!-- JS 생성 -->
            </div>

            <div class="modalBtnBox">
                <button id="pointConfirmBtn">
                    예
                </button>

                <button id="pointConfirmCancelBtn">
                    아니오
                </button>
            </div>
        </div>
    </div>

    <!-- 알림 -->
    <div id="alertModal" class="modal hidden">
        <div class="modalBox">
            <p id="alertMessage"></p>

            <div class="modalBtnBox">
                <button id="alertCloseBtn">
                    확인
                </button>
            </div>
        </div>
    </div>

    <!-- 상태 선택 -->
    <div id="stateSelectModal" class="modal hidden">
        <div class="modalBox">
            <h3>상태 변경</h3>

            <div class="stateRadioGroup">
                <label class="stateRadio">
                    <input
                        type="radio"
                        name="memberState"
                        class="stateChoice"
                        data-state="활동">
                    <span>활동</span>
                </label>

                <label class="stateRadio">
                    <input
                        type="radio"
                        name="memberState"
                        class="stateChoice"
                        data-state="외출">
                    <span>외출</span>
                </label>

                <label class="stateRadio">
                    <input
                        type="radio"
                        name="memberState"
                        class="stateChoice"
                        data-state="삭제">
                    <span>삭제</span>
                </label>
            </div>

            <div class="modalBtnBox">
                <button id="stateSelectSave">
                    저장
                </button>

                <button id="stateSelectCancel">
                    취소
                </button>
            </div>
        </div>
    </div>

    <!-- 상태 변경 확인 -->
    <div id="mstateModal" class="modal hidden">
        <div class="modalBox">
            <p id="mstateText" class="modalText">
                회원님을 외출 상태로 변경하시겠습니까?
            </p>

            <div class="modalBtnBox">
                <button id="mstateConfirm">
                    예
                </button>

                <button id="mstateCancel">
                    아니오
                </button>
            </div>
        </div>
    </div>

    <!-- 회원 포인트 내역 -->
    <div id="historyModal" class="modal hidden">
        <div class="modalBox historyBox">
            <div class="historyHeader">
                <h3 id="historyTitle">
                    포인트 내역
                </h3>

                <div class="historyHeaderRight">
                    <button id="nicknameChangeBtn">
                        이름변경
                    </button>

                    <button
                        id="historyCloseBtn"
                        class="historyCloseBtn"
                        type="button"
                        aria-label="닫기">
                    </button>
                </div>
            </div>

            <div id="historyList">
                <!-- JS 생성 -->
            </div>
        </div>
    </div>

    <!-- 닉네임 변경 -->
    <div id="nicknameModal" class="modal hidden">
        <div class="modalBox">
            <h3>이름 변경</h3>

            <input
                type="text"
                id="nicknameInput"
                class="nicknameInput"
                placeholder="새 닉네임">

            <div class="modalBtnBox">
                <button id="nicknameSaveBtn">
                    확인
                </button>

                <button id="nicknameCancelBtn">
                    취소
                </button>
            </div>
        </div>
    </div>

    <!-- 닉네임 변경 확인 -->
    <div id="nicknameConfirmModal" class="modal hidden">
        <div class="modalBox">
            <p
                id="nicknameConfirmText"
                class="modalText">
            </p>

            <div class="modalBtnBox">
                <button id="nicknameConfirmBtn">
                    예
                </button>

                <button id="nicknameConfirmCancelBtn">
                    아니오
                </button>
            </div>
        </div>
    </div>

    <!-- Excel 파일 선택 -->
    <input
        type="file"
        id="excelFile"
        accept=".xlsb,.xlsm,.xlsx,.xls"
        hidden>

    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <script type="module" src="admin.js"></script>
    <script type="module" src="adminExcel.js"></script>
</body>
</html>
